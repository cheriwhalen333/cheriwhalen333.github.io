<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMPA 3301 | Restricted Access</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }
        .animate-float {
            animation: float 4s ease-in-out infinite;
        }
    </style>
</head>
<body class="min-h-screen bg-slate-950 bg-gradient-to-br from-blue-950 via-slate-900 to-sky-950 text-slate-100 flex items-center justify-center p-4 selection:bg-blue-500/30 selection:text-blue-200 antialiased relative overflow-hidden">

    <!-- Background subtle radiant glows -->
    <div class="absolute -top-40 -left-40 w-96 h-96 bg-blue-600/15 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-indigo-600/15 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[32rem] h-[32rem] bg-sky-500/10 rounded-full blur-[100px] pointer-events-none"></div>

    <main class="relative z-10 w-full max-w-lg">
        <div class="backdrop-blur-xl bg-slate-900/60 border border-blue-500/20 shadow-2xl shadow-blue-950/50 rounded-2xl p-8 sm:p-12 text-center transition-all duration-300 hover:border-blue-500/30">
            
            <!-- Animated Lock / Shield Emblem -->
            <div class="flex justify-center mb-6">
                <div class="animate-float relative flex items-center justify-center w-20 h-20 rounded-2xl bg-blue-500/10 border border-blue-400/20 shadow-inner">
                    <div class="absolute inset-0 rounded-2xl bg-gradient-to-tr from-blue-600/20 to-transparent"></div>
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-10 h-10 text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
                    </svg>
                </div>
            </div>

            <!-- Course Tag -->
            <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold uppercase tracking-wider bg-blue-500/10 text-blue-300 border border-blue-500/20 mb-4">
                <span class="w-1.5 h-1.5 rounded-full bg-blue-400 animate-pulse"></span>
                CMPA 3301
            </span>

            <!-- Primary Message -->
            <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-white mb-3 leading-snug">
                The CMPA 3301 Course Dashboard is Private
            </h1>

            <!-- Explanatory note -->
            <p class="text-slate-400 text-sm sm:text-base leading-relaxed mb-8 max-w-sm mx-auto">
                Access to this dashboard is restricted to enrolled students, instructors, and authorized personnel.
            </p>

            <!-- Action buttons -->
            <div class="flex flex-col sm:flex-row items-center justify-center gap-3">
                <button 
                    onclick="handleLoginRequest()" 
                    class="w-full sm:w-auto px-6 py-2.5 text-sm font-medium text-white bg-blue-600 hover:bg-blue-500 active:bg-blue-700 rounded-xl transition duration-150 shadow-lg shadow-blue-600/25 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:ring-offset-2 focus:ring-offset-slate-900"
                >
                    Sign In with SSO
                </button>
                <button 
                    onclick="toggleHelpNotice()" 
                    class="w-full sm:w-auto px-6 py-2.5 text-sm font-medium text-slate-300 hover:text-white bg-slate-800/80 hover:bg-slate-700/80 border border-slate-700/50 rounded-xl transition duration-150 focus:outline-none focus:ring-2 focus:ring-slate-500"
                >
                    Request Access
                </button>
            </div>

            <!-- Interactive notice feedback container -->
            <div id="statusMessage" class="hidden mt-6 text-xs text-blue-300/90 bg-blue-950/40 border border-blue-800/40 rounded-lg p-3 transition-opacity"></div>
        </div>

        <!-- Footer / Identifier -->
        <p class="mt-6 text-center text-xs text-slate-500 tracking-wide">
            Department of Computational Media &amp; Arts &bull; Error 403 Restricted
        </p>
    </main>

    <script>
        function handleLoginRequest() {
            const msgBox = document.getElementById('statusMessage');
            msgBox.textContent = 'Redirecting to your institution’s Single Sign-On (SSO) portal...';
            msgBox.classList.remove('hidden');
        }

        function toggleHelpNotice() {
            const msgBox = document.getElementById('statusMessage');
            msgBox.textContent = 'Please contact your course instructor or registrar office to verify CMPA 3301 enrollment permissions.';
            msgBox.classList.remove('hidden');
        }
    </script>
</body>
</html>
